<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mrs. Anindita Sinha | SIT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .logo {
            width: 90px;
            margin-bottom: 15px;
        }

        .profile-photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #eeeeee;
            margin: 10px auto 20px;
            display: block;
        }

        h1 {
            font-size: 28px;
            color: #173b70;
            margin-bottom: 8px;
        }

        .qualification {
            font-size: 17px;
            font-style: italic;
            color: #555;
            margin-bottom: 8px;
        }

        .designation {
            font-size: 19px;
            font-weight: bold;
            color: #e67e00;
            margin-bottom: 18px;
        }

        .department {
            font-size: 16px;
            font-weight: bold;
            color: #173b70;
            margin-bottom: 5px;
        }

        .institute {
            font-size: 15px;
            color: #555;
            margin-bottom: 25px;
        }

        .contact {
            margin: 20px 0;
        }

        .contact a {
            display: block;
            text-decoration: none;
            margin: 10px 0;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .phone {
            background: #e8f5e9;
            color: #1b7a35;
        }

        .email {
            background: #e3f2fd;
            color: #1565c0;
        }

        .official {
            display: block;
            margin-top: 20px;
            padding: 14px;
            background: #173b70;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 500px) {
            .container {
                margin: 15px auto;
                padding: 12px;
            }

            .card {
                padding: 25px 18px;
            }

            h1 {
                font-size: 24px;
            }

            .profile-photo {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- Replace this with Anindita Sinha's photo filename -->
        <img src="anindita-sinha.jpg"
             alt="Mrs. Anindita Sinha"
             class="profile-photo">

        <h1>Mrs. Anindita Sinha</h1>

        <div class="qualification">
            PhD(Ongoing), M.Tech, B.Tech
        </div>

        <div class="designation">
            Assistant Professor
        </div>

        <div class="department">
            Department of Electronics &amp; Communication Engineering
        </div>

        <div class="institute">
            Siliguri Institute of Technology
        </div>

        <div class="contact">

            <a class="phone"
               href="tel:+919735081899">
                📞 9735081899
            </a>

            <a class="email"
               href="mailto:aninditasinha07@gmail.com">
                ✉️ aninditasinha07@gmail.com
            </a>

        </div>

        <a class="official"
           href="https://sittechno.org/faculty-staff-directory.html#:~:text=Mrs.%20Anindita%20Sinha"
           target="_blank">
            View Official Directory
        </a>

        <div class="footer">
            Siliguri Institute of Technology
        </div>

    </div>

</div>

</body>
</html>
